<div class="modal-backdrop" (click)="onClose()">
  <div class="modal" (click)="$event.stopPropagation()">
    <div class="drag-handle"></div>

    <div class="modal-header px-5 pt-2 pb-4">
      <h2>Onde assistir</h2>
      <button class="close-btn" (click)="onClose()">
        <i-feather name="x"></i-feather>
      </button>
    </div>

    <div class="providers-scroll px-5 pb-5">
      <div *ngIf="!isEmpty">
        <provider-component [typeStreaming]="'Assinar'" [titleMovie]="movieName" [provider]="providers.flatrate" *ngIf="providers?.flatrate"/>
        <provider-component [typeStreaming]="'Comprar'" [titleMovie]="movieName" [provider]="providers.buy" *ngIf="providers?.buy"/>
        <provider-component [typeStreaming]="'Alugar'" [titleMovie]="movieName" [provider]="providers.rent" *ngIf="providers?.rent"/>
      </div>

      <div *ngIf="isEmpty" class="empty-state">
        <i-feather name="frown"></i-feather>
        <span>Plataformas não disponíveis no Brasil</span>
      </div>
    </div>

  </div>
</div>
