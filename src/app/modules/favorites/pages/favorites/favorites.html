<div class="favorites-page">

  <div class="favorites-header">
    <div class="header-title">
      <div class="header-icon">
        <i-feather name="bookmark"></i-feather>
      </div>
      <h1>Favoritos</h1>
    </div>
    <span class="header-count" *ngIf="favoriteMovies.length > 0">
      {{ favoriteMovies.length }} {{ favoriteMovies.length === 1 ? 'filme' : 'filmes' }}
    </span>
  </div>

  <favorite-card [isLoading]="isLoading" [movies]="favoriteMovies"></favorite-card>

  <div *ngIf="!isLoading && favoriteMovies.length === 0" class="empty-state">
    <div class="empty-state__icon">
      <i-feather name="bookmark"></i-feather>
    </div>
    <h3>Nenhum favorito ainda</h3>
    <p>Filmes que você favoritar aparecerão aqui</p>
  </div>

</div>
