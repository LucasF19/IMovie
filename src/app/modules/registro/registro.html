<div class="registro-page">

  <div class="bg-gradient"></div>

  <div class="registro-header">
    <div class="brand">
      <div class="brand__icon">
        <i-feather name="play"></i-feather>
      </div>
      <span class="brand__name">iMovie</span>
    </div>
  </div>

  <div class="registro-content">
    <div class="registro-card">

      <div class="card-header">
        <h1>Criar conta</h1>
        <p>Preencha os dados para se cadastrar</p>
      </div>

      <form #registroForm="ngForm" (ngSubmit)="registrarUsuario(registroForm)">
        <div class="fields">

          <div class="field">
            <label>Nome</label>
            <div class="field__input-wrap">
              <i-feather name="user" class="field__icon"></i-feather>
              <input
                type="text"
                [(ngModel)]="nome"
                name="nome"
                placeholder="Seu nome completo"
                autocomplete="off"
                required
                minlength="8"
                #nomeModel="ngModel"
              />
            </div>
            <div class="field__errors" *ngIf="nomeModel.invalid && (nomeModel.dirty || nomeModel.touched)">
              <span *ngIf="nomeModel.errors?.['required']">Nome é obrigatório</span>
              <span *ngIf="nomeModel.errors?.['minlength']">Mínimo de 8 caracteres</span>
            </div>
          </div>

          <div class="field">
            <label>Email</label>
            <div class="field__input-wrap">
              <i-feather name="mail" class="field__icon"></i-feather>
              <input
                type="email"
                [(ngModel)]="email"
                autocomplete="off"
                name="email"
                placeholder="seu@email.com"
                required
                #emailModel="ngModel"
              />
            </div>
            <div class="field__errors" *ngIf="emailModel.invalid && (emailModel.dirty || emailModel.touched)">
              <span *ngIf="emailModel.errors?.['required']">Email é obrigatório</span>
              <span *ngIf="emailModel.errors?.['email']">Email inválido</span>
            </div>
          </div>

          <div class="field">
            <label>Senha</label>
            <div class="field__input-wrap">
              <i-feather name="lock" class="field__icon"></i-feather>
              <input
                [type]="showSenha ? 'text' : 'password'"
                [(ngModel)]="senha"
                name="senha"
                placeholder="Mínimo 6 caracteres"
                required
                minlength="6"
                #senhaModel="ngModel"
              />
              <i-feather
                class="field__toggle"
                [name]="showSenha ? 'eye-off' : 'eye'"
                (click)="showSenha = !showSenha"
              ></i-feather>
            </div>
            <div class="field__errors" *ngIf="senhaModel.invalid && (senhaModel.dirty || senhaModel.touched)">
              <span *ngIf="senhaModel.errors?.['required']">Senha é obrigatória</span>
              <span *ngIf="senhaModel.errors?.['minlength']">Mínimo de 6 caracteres</span>
            </div>
          </div>

          <div class="field">
            <label>Confirmar senha</label>
            <div class="field__input-wrap">
              <i-feather name="lock" class="field__icon"></i-feather>
              <input
                [type]="showConfirmar ? 'text' : 'password'"
                [(ngModel)]="confirmarSenha"
                name="confirmarSenha"
                placeholder="Repita a senha"
                required
                #confirmarSenhaModel="ngModel"
              />
              <i-feather
                class="field__toggle"
                [name]="showConfirmar ? 'eye-off' : 'eye'"
                (click)="showConfirmar = !showConfirmar"
              ></i-feather>
            </div>
            <div class="field__errors" *ngIf="confirmarSenhaModel.dirty">
              <span *ngIf="confirmarSenhaModel.errors?.['required']">Campo obrigatório</span>
              <span *ngIf="senha !== confirmarSenha && confirmarSenha.length > 0">As senhas não coincidem</span>
            </div>
          </div>

          <div *ngIf="errorMessage" class="error-box">
            <i-feather name="alert-circle"></i-feather>
            <span>{{ errorMessage }}</span>
          </div>

        </div>

        <button
          type="submit"
          class="btn-primary"
          [class.loading]="isLoading"
          [disabled]="registroForm.invalid || senha !== confirmarSenha"
        >
          <span *ngIf="!isLoading">Criar conta</span>
          <span *ngIf="isLoading" class="spinner"></span>
        </button>

      </form>

      <p class="login-link">
        Já tem conta? <a routerLink="/login">Faça login</a>
      </p>

    </div>
  </div>

</div>
